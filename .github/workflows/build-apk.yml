name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: "4.3"
      GODOT_STATUS: "stable"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android-sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          which sdkmanager || ls "$ANDROID_HOME/cmdline-tools/latest/bin" || true
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"
          sdkmanager --list_installed | head -n 30

      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Download Godot and export templates
        run: |
          set -e
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}
          ls ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS} | head -n 20

      - name: Import project
        run: |
          ./Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64 --headless --import

      - name: Export APK
        run: |
          mkdir -p build
          ./Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64 --headless --export-release "Android" build/salt-and-iron.apk
          ls -lh build/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: salt-and-iron-apk
          path: build/salt-and-iron.apk
          if-no-files-found: error
